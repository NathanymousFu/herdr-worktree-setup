id = "tdi.worktree-setup"
name = "Worktree Setup"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Run per-project setup and cleanup steps for worktree lifecycle events"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci"]

[[events]]
on = "worktree.created"
command = ["node", "src/setup.js"]

[[events]]
on = "worktree.removed"
command = ["node", "src/cleanup.js"]
